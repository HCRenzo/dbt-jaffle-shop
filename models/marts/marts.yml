version: 2

models:
  - name: fct_orders
    description: >
      Tabla de hechos: un registro por orden, con el monto total pagado.
      Grano: order_id.
    columns:
      - name: order_id
        description: Identificador único de la orden.
      - name: customer_id
        description: Referencia al cliente que hizo la orden (FK a dim_customers).
      - name: order_date
        description: Fecha en la que se realizó la orden.
      - name: order_status
        description: Estado de la orden.
      - name: order_total
        description: Monto total pagado por la orden, en dólares.

  - name: dim_customers
    description: >
      Tabla de dimensión: un registro por cliente, con atributos
      descriptivos y métricas agregadas de sus órdenes. Grano: customer_id.
    columns:
      - name: customer_id
        description: Identificador único del cliente.
      - name: first_name
        description: Nombre del cliente.
      - name: last_name
        description: Apellido del cliente.
      - name: first_order_date
        description: Fecha de la primera orden del cliente. Null si nunca compró.
      - name: most_recent_order_date
        description: Fecha de la orden más reciente del cliente. Null si nunca compró.
      - name: number_of_orders
        description: Cantidad total de órdenes hechas por el cliente.
      - name: customer_lifetime_value
        description: Suma de todos los pagos del cliente a través de todas sus órdenes.
